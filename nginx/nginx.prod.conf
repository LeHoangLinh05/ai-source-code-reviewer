# Production Nginx configuration for RepoGuard AI
# Routes:
#   /api/  -> backend (FastAPI)
#   /      -> frontend (Next.js)
# SSE streams under /api/review-jobs/.../stream are handled with buffering disabled.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Logging to stdout/stderr for Docker
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Upstream definitions
    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    # Map to detect SSE requests (EventSource)
    map $http_accept $is_sse {
        default     0;
        "~text/event-stream" 1;
    }

    server {
        listen 80;
        server_name _;

        # Max upload size (repo archives, etc.)
        client_max_body_size 100m;

        # ─── API routes ────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support: disable buffering and caching, long timeouts
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;

            # Required for SSE / chunked transfer
            chunked_transfer_encoding on;

            # Do not buffer responses
            proxy_request_buffering off;
        }

        # ─── Frontend ──────────────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket / HMR support (Next.js)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ─── Health check endpoint for Nginx itself ────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}