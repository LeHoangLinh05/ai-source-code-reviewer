name: repoguard-ai-dev

services:
  db-healthcheck:
    image: python:3.12-slim
    container_name: repoguard-db-healthcheck
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TARGET_URL: ${POSTGRES_URL:?Set POSTGRES_URL in .env}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, socket, urllib.parse as u; p=u.urlsplit(os.environ['TARGET_URL']); s=socket.create_connection((p.hostname, p.port or 5432), 5); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - repoguard-network

  cache-healthcheck:
    image: python:3.12-slim
    container_name: repoguard-cache-healthcheck
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, socket, urllib.parse as u; p=u.urlsplit(os.environ['REDIS_URL']); s=socket.create_connection((p.hostname, p.port or 6379), 5); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - repoguard-network

  mongodb:
    image: mongo:7
    container_name: repoguard-mongodb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-repoguard}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-repoguard_ai}
    ports:
      - "127.0.0.1:${MONGODB_HOST_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\" | grep -q 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - repoguard-network

  backend:
    image: repoguard-backend:latest
    build:
      context: ./backend
    container_name: repoguard-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RAG_CHROMA_PATH: /app/.chroma
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - sandbox_data:/tmp/sandbox
      - rag_data:/app/.chroma
      - model_cache:/root/.cache
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
      db-healthcheck:
        condition: service_healthy
      cache-healthcheck:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - repoguard-network

  worker:
    image: repoguard-backend:latest
    container_name: repoguard-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RAG_CHROMA_PATH: /app/.chroma
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      FIX_EXECUTOR_WORKSPACE_VOLUME: ${COMPOSE_PROJECT_NAME:-repoguard-ai-dev}_sandbox_data
    command:
      [
        "celery",
        "-A",
        "app.worker",
        "worker",
        "--loglevel=info",
        "--pool=solo",
      ]
    volumes:
      - sandbox_data:/tmp/sandbox
      - rag_data:/app/.chroma
      - model_cache:/root/.cache
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
      db-healthcheck:
        condition: service_healthy
      cache-healthcheck:
        condition: service_healthy
      fix-executor-image:
        condition: service_completed_successfully
    networks:
      - repoguard-network

  fix-executor-image:
    image: ${FIX_EXECUTOR_IMAGE:-repoguard-fix-executor:latest}
    build:
      context: .
      dockerfile: docker/fix-executor.Dockerfile
    command: ["python", "--version"]

  beat:
    image: repoguard-backend:latest
    container_name: repoguard-beat
    restart: unless-stopped
    env_file:
      - .env
    command:
      [
        "celery",
        "-A",
        "app.worker",
        "beat",
        "--loglevel=info",
      ]
    volumes:
      - model_cache:/root/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-healthcheck:
        condition: service_healthy
      cache-healthcheck:
        condition: service_healthy
    networks:
      - repoguard-network

  frontend:
    image: repoguard-frontend:latest
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    container_name: repoguard-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - repoguard-network

  nginx:
    image: nginx:1.27-alpine
    container_name: repoguard-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - repoguard-network

networks:
  repoguard-network:
    driver: bridge

volumes:
  mongodb_data:
  sandbox_data:
  rag_data:
  model_cache:
