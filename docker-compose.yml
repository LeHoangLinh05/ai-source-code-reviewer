name: repoguard-ai-dev

services:
  db-healthcheck:
    image: python:3.12-slim
    container_name: repoguard-db-healthcheck
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TARGET_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-repoguard}:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-repoguard_ai}}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, socket, sys, urllib.parse as u; p=u.urlsplit(os.environ['TARGET_URL']); s=socket.create_connection((p.hostname, p.port or 5432), 5); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - repoguard-network

  cache-healthcheck:
    image: python:3.12-slim
    container_name: repoguard-cache-healthcheck
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, socket, sys, urllib.parse as u; p=u.urlsplit(os.environ['REDIS_URL']); s=socket.create_connection((p.hostname, p.port or 6379), 5); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - repoguard-network

  mongodb:
    image: mongo:7
    container_name: repoguard-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-repoguard}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-change-me}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-repoguard_ai}
    ports:
      - "127.0.0.1:${MONGODB_HOST_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\" | grep -q 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - repoguard-network

  backend:
    build:
      context: ./backend
    container_name: repoguard-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-repoguard}:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-repoguard_ai}}
      POSTGRES_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-repoguard}:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-repoguard_ai}}
      MONGO_URL: ${MONGO_URL:-mongodb://${MONGODB_USER:-repoguard}:${MONGODB_PASSWORD:-change-me}@mongodb:27017/${MONGODB_DB:-repoguard_ai}?authSource=admin}
      MONGODB_URL: ${MONGO_URL:-mongodb://${MONGODB_USER:-repoguard}:${MONGODB_PASSWORD:-change-me}@mongodb:27017/${MONGODB_DB:-repoguard_ai}?authSource=admin}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      CELERY_BROKER_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      CELERY_RESULT_BACKEND: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://127.0.0.1:3000}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
      db-healthcheck:
        condition: service_healthy
      cache-healthcheck:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - repoguard-network

  worker:
    build:
      context: ./backend
    container_name: repoguard-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-repoguard}:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-repoguard_ai}}
      POSTGRES_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-repoguard}:${POSTGRES_PASSWORD:-postgres}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-repoguard_ai}}
      MONGO_URL: ${MONGO_URL:-mongodb://${MONGODB_USER:-repoguard}:${MONGODB_PASSWORD:-change-me}@mongodb:27017/${MONGODB_DB:-repoguard_ai}?authSource=admin}
      MONGODB_URL: ${MONGO_URL:-mongodb://${MONGODB_USER:-repoguard}:${MONGODB_PASSWORD:-change-me}@mongodb:27017/${MONGODB_DB:-repoguard_ai}?authSource=admin}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      CELERY_BROKER_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      CELERY_RESULT_BACKEND: ${REDIS_URL:-redis://host.docker.internal:6379/0}
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app.celery_app",
        "worker",
        "--loglevel=info",
        "--pool=solo",
      ]
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
      db-healthcheck:
        condition: service_healthy
      cache-healthcheck:
        condition: service_healthy
    networks:
      - repoguard-network

  frontend:
    build:
      context: ./frontend
    container_name: repoguard-frontend
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      WATCHPACK_POLLING: "true"
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - repoguard-network

  nginx:
    image: nginx:1.27-alpine
    container_name: repoguard-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - repoguard-network

networks:
  repoguard-network:
    driver: bridge

volumes:
  mongodb_data:
